<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        const storedScheme = localStorage.getItem('color-scheme');
        const meta = document.querySelector('meta[name="color-scheme"]');
        if (meta) meta.content = storedScheme ?? 'light dark';
        const isDark =
          storedScheme === 'dark' ||
          (!storedScheme && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', isDark);
      } catch {}
    </script>
    <title>Naukri Support — Employer & Candidate Hiring Assistant</title>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
